
name: Oxyaura Server CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get project code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Enable Docker image building
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build image and push to Docker Hub
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oxyaura-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/oxyaura-backend:${{ github.sha }}

      # 5. Configure SSH for Azure VM
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      # 6. Pull image and replace the running container
      - name: Deploy to Azure VM
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$DOCKER_USER/oxyaura-backend:$IMAGE_TAG"

          ssh -i ~/.ssh/deploy_key \
            "$VM_USER@$VM_HOST" \
            "sudo docker pull $IMAGE &&
             (sudo docker stop oxyaura-api || true) &&
             (sudo docker rm oxyaura-api || true) &&
             sudo docker run -d \
               --name oxyaura-api \
               --restart unless-stopped \
               --env-file /opt/oxyaura/.env \
               -p 8000:8000 \
               $IMAGE"

      # 7. Verify that the container is running
      - name: Verify deployment
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$VM_USER@$VM_HOST" \
            "sudo docker ps --filter name=oxyaura-api"
